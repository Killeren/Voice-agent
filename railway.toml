[build]
# Use the web server as the default service
builder = "dockerfile"

[deploy]
# Start command for both web server and agent
startCommand = "./start-railway.sh"

# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Auto-deploy on push to main branch
[build.watchPatterns]
include = ["**/*.py", "**/*.html", "**/*.js", "**/*.css", "requirements.txt", "Dockerfile"]
