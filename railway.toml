[build]
# Use the web server as the default service
builder = "dockerfile"
# Watch patterns for auto-deploy
watchPaths = ["**/*.py", "**/*.html", "**/*.js", "**/*.css", "requirements.txt", "Dockerfile"]

[deploy]
# Start command for both web server and agent
startCommand = "./start-railway.sh"

# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
