services:
  voice-agent-server:
    build: .
    container_name: voice-agent-server
    ports:
      - "8080:8080"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://host.docker.internal:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    command: ["python", "server.py"]
    networks:
      - voice-agent-network

  voice-agent-worker:
    build: .
    container_name: voice-agent-worker
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://host.docker.internal:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    volumes:
      - ./.env:/app/.env:ro
      - ./agent.py:/app/agent.py:ro
      - ./edge_tts_plugin.py:/app/edge_tts_plugin.py:ro
    restart: unless-stopped
    command: ["python", "agent.py", "start"]
    networks:
      - voice-agent-network
    depends_on:
      - voice-agent-server

networks:
  voice-agent-network:
    driver: bridge
